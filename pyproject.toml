[project]
name = "job-finder"
version = "0.1.0"
description = "Watches career pages for Ireland-based roles, emails alerts, and serves a Flask dashboard."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.7.22",
    "echartsy>=0.7.4",
    "flask>=3.1.3",
    "lxml>=6.1.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
