<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job-Finder Dashboard</title>
<style>
  :root { --bg:#f6f8fa; --card:#fff; --border:#e1e4e8; --ink:#24292f;
          --muted:#57606a; --accent:#0b5394; --green:#1a7f37; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  nav { background:var(--accent); padding:0 24px; display:flex; gap:4px; }
  nav a { color:#fff; text-decoration:none; padding:14px 16px; font-size:14px;
          font-weight:600; opacity:.85; }
  nav a:hover, nav a.active { opacity:1; border-bottom:3px solid #fff; }
  main { max-width:1100px; margin:24px auto; padding:0 24px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
           gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:10px; padding:16px; }
  .card .num { font-size:28px; font-weight:700; }
  .card .label { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:10px 14px; border-top:1px solid var(--border);
           font-size:14px; }
  th { background:#f0f3f6; border-top:none; color:var(--muted); font-size:12px;
       text-transform:uppercase; letter-spacing:.4px; }
  a.btn { background:var(--green); color:#fff; padding:4px 12px; border-radius:6px;
          text-decoration:none; font-size:13px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; }
  .pill.on { background:#dafbe1; color:var(--green); }
  .pill.off { background:#f0f3f6; color:var(--muted); }
  form.filters { display:flex; gap:8px; margin-bottom:16px; }
  input, select { padding:8px 10px; border:1px solid var(--border);
                  border-radius:6px; font-size:14px; }
  pre.log { background:#0d1117; color:#c9d1d9; padding:16px; border-radius:10px;
            font-size:12px; overflow-x:auto; max-height:70vh; }
</style>
</head>
<body>
<nav>
  <a href="/" class="{{ 'active' if request.path == '/' }}">Overview</a>
  <a href="/jobs" class="{{ 'active' if request.path == '/jobs' }}">Jobs</a>
  <a href="/analytics" class="{{ 'active' if request.path == '/analytics' }}">Analytics</a>
  <a href="/emails" class="{{ 'active' if request.path == '/emails' }}">Emails</a>
  <a href="/logs" class="{{ 'active' if request.path == '/logs' }}">Logs</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
