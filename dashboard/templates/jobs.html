{% extends "base.html" %}
{% block content %}
<h2>Job history</h2>
<form class="filters" method="get" action="/jobs">
  <select name="company" onchange="this.form.submit()">
    <option value="">All companies</option>
    {% for c in companies %}
    <option value="{{ c }}" {{ "selected" if c == company }}>{{ c }}</option>
    {% endfor %}
  </select>
  <input type="text" name="q" placeholder="Search titles…" value="{{ q }}">
  <input type="text" name="skill" class="skill-search" placeholder="Search skill e.g. Airflow…" value="{{ skill }}">
  <label><input type="checkbox" name="active" value="1" {{ "checked" if active == "1" }}> Active only</label>
  <button type="submit">Search</button>
</form>

{% from "_macros.html" import job_row %}
{% if jobs %}
<div class="job-row-header">
  <span></span><span>Company</span><span>Title</span><span>Seniority</span><span>Status</span><span></span>
</div>
{% for job in jobs %}
{{ job_row(job, skill, skills_by_job) }}
{% endfor %}
{% else %}
<p>No jobs match.</p>
{% endif %}
{% endblock %}
