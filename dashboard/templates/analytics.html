{% extends "base.html" %}
{% block content %}
<h2>Analytics</h2>
<form class="filters" method="get" action="/analytics">
  <select name="sector" onchange="this.form.submit()">
    <option value="">All sectors</option>
    <option value="pharma" {{ "selected" if sector == "pharma" }}>Pharma</option>
    <option value="tech" {{ "selected" if sector == "tech" }}>Tech</option>
  </select>
</form>
<div class="cards">
  <div class="card" style="grid-column:1/-1">
    <div class="chart-wrap"><canvas id="perCompany"></canvas></div>
    <div class="drilldown hidden" id="drilldown-perCompany"></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <div class="chart-wrap"><canvas id="newPerWeek"></canvas></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <div class="chart-wrap"><canvas id="categories"></canvas></div>
    <div class="drilldown hidden" id="drilldown-categories"></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <div class="chart-wrap"><canvas id="topSkills"></canvas></div>
    <div class="drilldown hidden" id="drilldown-topSkills"></div>
  </div>
  <div class="card">
    <div class="chart-wrap small"><canvas id="seniority"></canvas></div>
    <div class="drilldown hidden" id="drilldown-seniority"></div>
  </div>
  <div class="card" style="grid-column:1/-1">
    <div class="chart-wrap"><canvas id="skillsByCategory"></canvas></div>
    <div class="drilldown hidden" id="drilldown-skillsByCategory"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="{{ url_for('static', filename='drilldown.js') }}"></script>
<script src="{{ url_for('static', filename='analytics-charts.js') }}"></script>
<script>initAnalyticsCharts("{{ sector }}");</script>
{% endblock %}
